# Automatisch live gehen: jeder Push auf main startet deploy.sh auf dem Server.
# Einmalig einrichten (README → „Automatisches Deployment“): Secrets DEPLOY_HOST, DEPLOY_SSH_KEY (optional DEPLOY_USER, DEPLOY_PATH)
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: { group: deploy, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_SECRETS: ${{ secrets.DEPLOY_HOST != '' && secrets.DEPLOY_SSH_KEY != '' }}
    steps:
      - name: Hinweis – Secrets fehlen
        if: env.HAS_SECRETS != 'true'
        run: echo "::notice::Auto-Deploy übersprungen – Secrets DEPLOY_HOST und DEPLOY_SSH_KEY fehlen (README → Automatisches Deployment)."
      - name: Auf dem Server deployen
        if: env.HAS_SECRETS == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER || 'root' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 15m
          script: cd ${{ secrets.DEPLOY_PATH || '/opt/euro-trade-shop' }} && git pull --ff-only && bash deploy.sh   # erst holen, dann starten – sonst liest bash ein deploy.sh, das sich gerade ändert
